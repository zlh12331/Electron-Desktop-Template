# Local durable relay. Only the host's loopback ports are published by compose.yaml.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

extensions:
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true
    fsync: true
    # This is a per-database ceiling, NOT a quota for the whole volume.
    max_size: 268435456

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 80
  batch:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512

exporters:
  otlp_http/upstream:
    endpoint: ${env:OTLP_UPSTREAM_ENDPOINT:-http://host.docker.internal:4318}
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage
      sizer: requests
      queue_size: 1000
      num_consumers: 2
      block_on_overflow: false

service:
  extensions: [file_storage]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/upstream]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/upstream]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/upstream]
