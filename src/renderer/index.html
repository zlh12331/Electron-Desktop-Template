<!doctype html>
<html lang="zh-CN" style="background:#0A0A0A">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>(function(){try{var t=localStorage.getItem('electron-desktop-template:theme');if(t!=='light'&&t!=='dark'&&t!=='system'){t='dark'}var dark=t==='dark'||(t==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);var d=document.documentElement;if(dark){d.classList.add('dark');}else{d.classList.remove('dark');}d.style.removeProperty('background');}catch{document.documentElement.style.removeProperty('background');}})();</script>
    <title>Electron Desktop Template</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
